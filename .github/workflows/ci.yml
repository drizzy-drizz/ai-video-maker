name: Application CI
on:
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'web/**'
      - '.github/workflows/ci.yml'
  pull_request:
concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile application
        run: python -m compileall -q app.py animatic.py asset_library.py studio_quality.py story_planner.py caption_engine.py voice_engine.py timeline_engine.py
      - name: Check JavaScript syntax
        run: node --check web/app.js
      - name: Install FFmpeg for media integration test
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Confirm FFmpeg
        run: ffmpeg -version && ffprobe -version
      - name: Run tests including MP4 assembly
        run: python -m unittest discover -s tests -v
